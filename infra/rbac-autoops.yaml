# =============================================================================
# rbac-autoops.yaml: READ-ONLY ServiceAccount + RBAC for AutoOps MCP
# =============================================================================
# The diagnostic tools (diagnose_pod, pod_logs, list_events...) query the
# Kubernetes API from inside the cluster. The pod runs with this SA, with
# strictly read-only permissions. Least privilege: AutoOps never modifies the
# cluster and never reads Secrets.
#
# deploy.sh applies it automatically (rbac-<project>.yaml convention) after
# creating the namespace. The backend values reference the SA without creating it
# (its lifecycle is cluster-scoped, outside the Helm release):
#   serviceAccount: { create: false, name: autoops-mcp }
#
# Check (the last two MUST answer "no"):
#   kubectl auth can-i list pods    --as=system:serviceaccount:autoops:autoops-mcp -A  # yes
#   kubectl auth can-i get pods/log --as=system:serviceaccount:autoops:autoops-mcp -A  # yes
#   kubectl auth can-i get secrets  --as=system:serviceaccount:autoops:autoops-mcp -A  # no
#   kubectl auth can-i delete pods  --as=system:serviceaccount:autoops:autoops-mcp -A  # no
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: autoops-mcp
  namespace: autoops
  labels:
    app.kubernetes.io/part-of: autoops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: autoops-mcp-readonly
  labels:
    app.kubernetes.io/part-of: autoops
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
# Only what the MCP tools read; 'secrets' and 'configmaps' are deliberately left out.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: autoops-mcp-readonly
  labels:
    app.kubernetes.io/part-of: autoops
subjects:
  - kind: ServiceAccount
    name: autoops-mcp
    namespace: autoops
roleRef:
  kind: ClusterRole
  name: autoops-mcp-readonly
  apiGroup: rbac.authorization.k8s.io
