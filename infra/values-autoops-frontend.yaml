# =============================================================================
# values-autoops-frontend.yaml: AutoOps Angular frontend
# Chart: infra/charts/generic-app
# =============================================================================
# Angular SPA served by nginx. It calls POST /search; the Ingress routes
# /search, /mcp and /actuator to the backend (setup-app-ingress.sh).
# Deploy:
#   ./infra/scripts/deploy.sh --project autoops --component frontend --tag 0.1.0
# =============================================================================

namespace: autoops

image:
  repository: registry.local/autoops-frontend
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicaCount: 1

strategy:
  type: RollingUpdate

container:
  port: 80           # nginx:alpine; 8080 with nginx-unprivileged for runAsNonRoot
  portName: http

service:
  type: ClusterIP
  port: 80

# Config is baked into the Angular build: no ConfigMap or Secrets.
configmap:
  enabled: false
secretEnv: []

probes:
  readiness:
    enabled: true
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 3
    periodSeconds: 5
    failureThreshold: 3
  liveness:
    enabled: true
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 10
    periodSeconds: 15
    failureThreshold: 3

resources:
  requests:
    memory: 16Mi
    cpu: 10m
  limits:
    memory: 64Mi
    cpu: 100m

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: false   # nginx:alpine runs as root; use nginx-unprivileged to set true

# The Ingress is created by setup-app-ingress.sh --project autoops ("/" -> this Service).
ingress:
  enabled: false
