# =============================================================================
# values-wikijs.yaml: Wiki.js (self-hosted wiki, an extra RAG source for AutoOps)
# Chart: infra/charts/generic-app
# =============================================================================
# Unlike autoops/l1-copilot, Wiki.js is not deployed with deploy.sh: it uses the
# public image requarks/wiki:2 (no build/push of its own) and is a single
# component, not backend+frontend. infra/scripts/08-setup-wikijs.sh installs it:
#   kubectl apply -f infra/namespace-wiki.yaml
#   kubectl create secret generic postgres-credentials -n wiki --from-literal=...
#   helm upgrade --install wikijs infra/charts/generic-app -n wiki -f infra/values-wikijs.yaml
#
# State lives entirely in the shared Postgres (database `wiki`, created by
# wiki/scripts/setup-wiki-db.sh). No PVC of its own.
# =============================================================================

namespace: wiki

image:
  repository: requarks/wiki
  tag: "2"
  pullPolicy: IfNotPresent

replicaCount: 1

strategy:
  type: RollingUpdate

container:
  port: 3000
  portName: http

service:
  type: ClusterIP
  port: 3000

# Non-sensitive variables. Wiki.js is not Spring (native env config, no relaxed
# binding), so the names are its own (DB_TYPE, DB_HOST...).
env:
  - name: DB_TYPE
    value: "postgres"
  - name: DB_HOST
    value: "postgres.infra.svc.cluster.local"
  - name: DB_PORT
    value: "5432"
  - name: DB_NAME
    value: "wiki"

# Shared Postgres credentials, copied into the `wiki` namespace by
# 08-setup-wikijs.sh (the chart never creates the Secret).
secretEnv:
  - name: DB_USER
    secretName: postgres-credentials
    secretKey: POSTGRES_USER
  - name: DB_PASS
    secretName: postgres-credentials
    secretKey: POSTGRES_PASSWORD

probes:
  readiness:
    enabled: true
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 20
    periodSeconds: 10
    failureThreshold: 6
  liveness:
    enabled: true
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 40
    periodSeconds: 15
    failureThreshold: 3

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m

# Overrides the chart default: requarks/wiki:2 runs as user "node" (not numeric,
# USER node in its Dockerfile). With runAsNonRoot:true the kubelet cannot verify it
# is non-root and the pod stays in CreateContainerConfigError. Helm deep-merges
# values, so it must be disabled explicitly; omitting the key keeps the default.
securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: false

# The chart itself renders the Ingress (single Service, no backend/frontend
# convention): setup-app-ingress.sh is not used for this project.
ingress:
  enabled: true
  className: traefik
  host: wiki.local
  paths: []

ingressExtraPaths: []
