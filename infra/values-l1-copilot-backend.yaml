# =============================================================================
# values-l1-copilot-backend.yaml: L1 Support Copilot backend
# Chart: infra/charts/generic-app
# =============================================================================
# Deploy (deploy.sh also creates the namespace and syncs the Secrets from infra/.env.local):
#   ./infra/scripts/deploy.sh --project l1-copilot --component backend
# =============================================================================
# replicaCount=1 and strategy=Recreate while the graph checkpointer is a MemorySaver
# (conversation state in the pod's memory). No HPA until a persistent
# BaseCheckpointSaver is in place.
# =============================================================================

image:
  repository: registry.local/l1-copilot-backend
  tag: "1.0.0"
  pullPolicy: IfNotPresent

replicaCount: 1

strategy:
  type: Recreate   # in-memory conversation state, see the note above

container:
  port: 8080   # must match server.port in application-prod.yml
  portName: http

service:
  type: ClusterIP
  port: 8080

# Non-sensitive variables (prod profile + JDBC to the shared Postgres)
configmap:
  enabled: true
  data:
    SPRING_PROFILES_ACTIVE: "prod"
    SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres.infra.svc.cluster.local:5432/l1_copilot"
    JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"

# Sensitive variables: the chart never creates these Secrets; deploy.sh syncs them
# from infra/.env.local.
secretEnv:
  - name: GEMINI_API_KEY
    secretName: gemini-api-key
    secretKey: GEMINI_API_KEY
  - name: SPRING_DATASOURCE_USERNAME
    secretName: postgres-credentials
    secretKey: POSTGRES_USER
  - name: SPRING_DATASOURCE_PASSWORD
    secretName: postgres-credentials
    secretKey: POSTGRES_PASSWORD

probes:
  # Up to 150s for the JVM to start before liveness may restart it.
  startup:
    enabled: true
    httpGet:
      path: /api/actuator/health/liveness
      port: http
    periodSeconds: 5
    failureThreshold: 30
  # The backend lives under /api (server.servlet.context-path in application.yml),
  # so actuator is at /api/actuator/health/*.
  readiness:
    enabled: true
    httpGet:
      path: /api/actuator/health/readiness
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 6
  liveness:
    enabled: true
    httpGet:
      path: /api/actuator/health/liveness
      port: http
    initialDelaySeconds: 0
    periodSeconds: 15
    failureThreshold: 3

resources:
  requests:
    memory: 512Mi
    cpu: 250m
  limits:
    memory: 1Gi
    cpu: 1000m

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

# Ingress: single host l1-copilot.local, path routing on port 80. It is managed by
# infra/scripts/setup-app-ingress.sh --project l1-copilot, so it stays disabled here
# to avoid clashing with that resource.
#
# Resulting URLs (hosts entry: infra/scripts/add-host.ps1 -Hostname l1-copilot.local):
#   http://l1-copilot.local/              <- Angular frontend
#   http://l1-copilot.local/api            <- REST API
#   http://l1-copilot.local/api/actuator   <- Actuator
ingress:
  enabled: false

ingressExtraPaths: []
