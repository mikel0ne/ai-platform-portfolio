# =============================================================================
# reranker.yaml: Weaviate reranker-transformers module (namespace `infra`)
# =============================================================================
# Cross-encoder that reorders hybrid search results by relevance. AutoOps
# (WeaviateGateway) asks for the rerank natively in the query
# (_additional { rerank ... }), so this module is required by search.
#
# Applied by infra/scripts/06-setup-weaviate.sh together with weaviate.yaml;
# Weaviate finds it through RERANKER_INFERENCE_API (see weaviate.yaml).
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weaviate-reranker
  namespace: infra
  labels:
    app: weaviate-reranker
    app.kubernetes.io/part-of: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weaviate-reranker
  template:
    metadata:
      labels:
        app: weaviate-reranker
        app.kubernetes.io/part-of: infra
    spec:
      containers:
        - name: reranker
          image: cr.weaviate.io/semitechnologies/reranker-transformers:cross-encoder-ms-marco-MiniLM-L-6-v2
          ports:
            - { containerPort: 8080, name: http }
          env:
            - { name: ENABLE_CUDA, value: "0" }
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            # 1Gi was too little for reranking the larger corpus (557 chunks, longer
            # texts): OOMKilled on the first real search after reindexing.
            limits:   { memory: 2Gi }
          readinessProbe:
            httpGet: { path: /.well-known/ready, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: weaviate-reranker
  namespace: infra
  labels:
    app: weaviate-reranker
    app.kubernetes.io/part-of: infra
spec:
  selector:
    app: weaviate-reranker
  ports:
    - { port: 8080, targetPort: 8080, name: http }
