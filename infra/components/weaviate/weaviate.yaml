# =============================================================================
# weaviate.yaml: SHARED vector store of the cluster (namespace `infra`)
# =============================================================================
# Same approach as the shared Postgres: ONE Weaviate instance for the whole
# portfolio. Each project uses its own class (e.g. AutoOps ->
# AutoopsDocChunk) instead of an instance per project.
#
# No vectorizer module (vectorizer: none): each app brings its own vectors
# (AutoOps computes them with Gemini embeddings). No auth (local only).
#
# Applied by infra/scripts/06-setup-weaviate.sh. Internal DNS:
#   weaviate.infra.svc.cluster.local  (HTTP 8080, gRPC 50051)
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: weaviate-data
  namespace: infra
  labels:
    app: weaviate
    app.kubernetes.io/part-of: infra
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: weaviate
  namespace: infra
  labels:
    app: weaviate
    app.kubernetes.io/part-of: infra
spec:
  serviceName: weaviate
  replicas: 1
  selector:
    matchLabels:
      app: weaviate
  template:
    metadata:
      labels:
        app: weaviate
        app.kubernetes.io/part-of: infra
    spec:
      containers:
        - name: weaviate
          image: cr.weaviate.io/semitechnologies/weaviate:1.27.0
          args: ["--host", "0.0.0.0", "--port", "8080", "--scheme", "http"]
          ports:
            - { containerPort: 8080, name: http }
            - { containerPort: 50051, name: grpc }
          env:
            - { name: PERSISTENCE_DATA_PATH, value: /var/lib/weaviate }
            - { name: AUTHENTICATION_ANONYMOUS_ENABLED, value: "true" }   # local only: no auth
            - { name: QUERY_DEFAULTS_LIMIT, value: "25" }
            - { name: DEFAULT_VECTORIZER_MODULE, value: "none" }          # apps bring their vectors
            - { name: ENABLE_MODULES, value: "reranker-transformers" }    # native rerank (used by AutoOps)
            - { name: RERANKER_INFERENCE_API, value: "http://weaviate-reranker.infra.svc.cluster.local:8080" }
            - { name: CLUSTER_HOSTNAME, value: "node1" }
          volumeMounts:
            - { name: data, mountPath: /var/lib/weaviate }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { memory: 1Gi }
          readinessProbe:
            httpGet: { path: /v1/.well-known/ready, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /v1/.well-known/live, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: weaviate-data
---
apiVersion: v1
kind: Service
metadata:
  name: weaviate
  namespace: infra
  labels:
    app: weaviate
    app.kubernetes.io/part-of: infra
spec:
  selector:
    app: weaviate
  ports:
    - { port: 8080,  targetPort: 8080,  name: http }
    - { port: 50051, targetPort: 50051, name: grpc }
