# =============================================================================
# generic-app: default values (the full contract of the chart)
# =============================================================================
# Each app keeps its own infra/values-<project>-<component>.yaml and overrides
# only what it needs. See values-examples/ for ready-made templates.
# =============================================================================

# -- Overrides the chart name (affects labels and resource names)
nameOverride: ""
# -- Overrides the full name (release name + chart) when an exact name is needed
fullnameOverride: ""

namespace: default

image:
  repository: my-app
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

strategy:
  # RollingUpdate (default) or Recreate. Use Recreate when the app keeps conversation
  # state in memory (e.g. a LangGraph MemorySaver), so two pods never coexist.
  type: RollingUpdate
  # rollingUpdate:       # only applies to RollingUpdate
  #   maxSurge: 1
  #   maxUnavailable: 0

container:
  port: 8080
  portName: http

service:
  type: ClusterIP
  port: 8080
  # targetPort defaults to the container portName ("http")

# -----------------------------------------------------------------------------
# Chart-owned ConfigMap (non-sensitive env vars). When enabled it is named after
# the release and mounted as envFrom in the Deployment.
# -----------------------------------------------------------------------------
configmap:
  enabled: false
  data: {}
  # data:
  #   SPRING_PROFILES_ACTIVE: "prod"
  #   SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/mydb"
  #   JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"

# -- Existing ConfigMaps in the cluster to mount as envFrom
envFrom:
  configMaps: []
  # - name: shared-config

# -- Plain, non-sensitive env vars
env: []
# - name: TZ
#   value: "Europe/Madrid"

# -- Env vars from external Secrets. The chart references Secrets but never creates
# them (deploy.sh syncs them from infra/.env.local; see NOTES.txt).
secretEnv: []
# - name: MY_API_KEY          # env var name in the container
#   secretName: my-secret     # Kubernetes Secret name
#   secretKey: MY_API_KEY     # key inside the Secret

probes:
  readiness:
    enabled: true
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 3
    periodSeconds: 5
    failureThreshold: 3
  liveness:
    enabled: true
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 10
    periodSeconds: 15
    failureThreshold: 3

resources:
  requests:
    memory: 64Mi
    cpu: 50m
  limits:
    memory: 128Mi
    cpu: 200m

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true

podSecurityContext: {}
# podSecurityContext:
#   fsGroup: 1000
#   runAsUser: 1000

ingress:
  enabled: false
  className: nginx
  host: ""
  tls:
    enabled: false
    secretName: ""
  # Paths routed to this service; empty means a single "/" path.
  paths: []
  # - path: /api
  #   pathType: Prefix
  # - path: /actuator/health
  #   pathType: Prefix

# -- Extra paths to other services (for an Ingress shared between apps)
ingressExtraPaths: []
# - path: /
#   pathType: Prefix
#   serviceName: frontend
#   servicePort: http

# Never combine the HPA with strategy.type=Recreate or with in-memory state.
hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  # targetMemoryUtilizationPercentage: 80

serviceAccount:
  create: false
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}
deploymentAnnotations: {}
