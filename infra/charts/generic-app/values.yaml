# =============================================================================
# generic-app — values.yaml
# =============================================================================
# Copia este fichero a tu proyecto como values-<nombre>.yaml y sobreescribe
# solo lo que necesites. Ver values-examples/ para plantillas listas para usar.
# =============================================================================

# -- Sobreescribe el nombre del chart (afecta a los labels y nombres de recurso)
nameOverride: ""
# -- Sobreescribe el nombre completo (release-name + chart). Úsalo para nombres exactos.
fullnameOverride: ""

# -- Namespace donde se despliega la aplicación
namespace: default

# -----------------------------------------------------------------------------
# Imagen
# -----------------------------------------------------------------------------
image:
  repository: my-app
  tag: latest
  pullPolicy: IfNotPresent

# -----------------------------------------------------------------------------
# Réplicas y estrategia de despliegue
# -----------------------------------------------------------------------------
replicaCount: 1

strategy:
  # RollingUpdate (por defecto) o Recreate.
  # Usa Recreate si la app tiene estado conversacional en memoria (ej: LangGraph MemorySaver).
  type: RollingUpdate
  # rollingUpdate:       # opcional, solo aplica si type=RollingUpdate
  #   maxSurge: 1
  #   maxUnavailable: 0

# -----------------------------------------------------------------------------
# Puerto del contenedor
# -----------------------------------------------------------------------------
container:
  port: 8080
  portName: http

# -----------------------------------------------------------------------------
# Service
# -----------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 8080
  # targetPort usa el portName del contenedor por defecto ("http")

# -----------------------------------------------------------------------------
# ConfigMap propio del chart (variables de entorno no sensibles)
# Si enabled=true, se crea un ConfigMap con el nombre del release y se monta
# automáticamente como envFrom en el Deployment.
# -----------------------------------------------------------------------------
configmap:
  enabled: false
  data: {}
  # data:
  #   SPRING_PROFILES_ACTIVE: "prod"
  #   SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/mydb"
  #   JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"

# -- ConfigMaps externos ya existentes en el cluster para montar como envFrom
envFrom:
  configMaps: []
  # - name: shared-config

# -----------------------------------------------------------------------------
# Variables de entorno
# -----------------------------------------------------------------------------
# -- Vars planas no sensibles (env[].name + env[].value)
env: []
# - name: TZ
#   value: "Europe/Madrid"

# -- Vars desde Secrets externos (creados con kubectl o script, NUNCA en el chart).
# El chart referencia los Secrets pero NO los crea. Ver NOTES.txt y infra/scripts/create-secrets.ps1.
secretEnv: []
# - name: MY_API_KEY          # nombre de la env var en el contenedor
#   secretName: my-secret     # nombre del Secret en K8s
#   secretKey: MY_API_KEY     # clave dentro del Secret

# -----------------------------------------------------------------------------
# Probes
# -----------------------------------------------------------------------------
probes:
  readiness:
    enabled: true
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 3
    periodSeconds: 5
    failureThreshold: 3
  liveness:
    enabled: true
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 10
    periodSeconds: 15
    failureThreshold: 3

# -----------------------------------------------------------------------------
# Recursos
# -----------------------------------------------------------------------------
resources:
  requests:
    memory: 64Mi
    cpu: 50m
  limits:
    memory: 128Mi
    cpu: 200m

# -----------------------------------------------------------------------------
# Security context del contenedor
# -----------------------------------------------------------------------------
securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true

# Security context del pod (opcional)
podSecurityContext: {}
# podSecurityContext:
#   fsGroup: 1000
#   runAsUser: 1000

# -----------------------------------------------------------------------------
# Ingress (desactivado por defecto)
# -----------------------------------------------------------------------------
ingress:
  enabled: false
  className: nginx
  host: ""
  tls:
    enabled: false
    secretName: ""
  # Rutas hacia este servicio. Si vacío, se genera una ruta "/" automáticamente.
  paths: []
  # - path: /api
  #   pathType: Prefix
  # - path: /actuator/health
  #   pathType: Prefix

# -- Rutas extra hacia otros servicios (para Ingress compartidos entre apps)
ingressExtraPaths: []
# - path: /
#   pathType: Prefix
#   serviceName: frontend
#   servicePort: http

# -----------------------------------------------------------------------------
# HorizontalPodAutoscaler (desactivado por defecto)
# IMPORTANTE: no uses HPA con strategy.type=Recreate ni con estado en memoria.
# -----------------------------------------------------------------------------
hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  # targetMemoryUtilizationPercentage: 80

# -----------------------------------------------------------------------------
# ServiceAccount (desactivado por defecto)
# -----------------------------------------------------------------------------
serviceAccount:
  create: false
  name: ""
  annotations: {}

# -----------------------------------------------------------------------------
# Anotaciones y labels extra
# -----------------------------------------------------------------------------
podAnnotations: {}
podLabels: {}
deploymentAnnotations: {}
