# =============================================================================
# values-frontend.yaml: template for Angular / React frontends served by nginx
# =============================================================================
# Usage:
#   helm upgrade --install my-frontend infra/charts/generic-app \
#     -f infra/charts/generic-app/values-examples/values-frontend.yaml \
#     --set image.repository=my-frontend \
#     --set image.tag=1.0.0
# =============================================================================
# Differences from the Java backend:
#   - No ConfigMap or Secrets (frontends must not hold sensitive values;
#     config is baked in at build time or served from /assets/config.json)
#   - Port 80 (nginx), or 8080 with nginxinc/nginx-unprivileged for runAsNonRoot
#   - Probes hit "/" (the root page)
#   - Much lower resources
#   - Always RollingUpdate (no in-memory state)
# =============================================================================

namespace: default   # your project's namespace

image:
  repository: my-frontend
  tag: "1.0.0"
  pullPolicy: IfNotPresent

replicaCount: 1

strategy:
  type: RollingUpdate

container:
  port: 80      # 8080 with nginxinc/nginx-unprivileged (recommended for runAsNonRoot)
  portName: http

service:
  type: ClusterIP
  port: 80

configmap:
  enabled: false   # no server-side config: it is baked into the build

secretEnv: []      # frontends must not handle secrets at runtime

probes:
  readiness:
    enabled: true
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 3
    periodSeconds: 5
    failureThreshold: 3
  liveness:
    enabled: true
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 10
    periodSeconds: 15
    failureThreshold: 3

resources:
  requests:
    memory: 16Mi
    cpu: 10m
  limits:
    memory: 64Mi
    cpu: 100m

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: false   # nginx:alpine runs as root; use nginx-unprivileged to set true

# Ingress: the frontend usually serves "/" and the backend "/api". Both can share
# the backend's Ingress host through ingressExtraPaths, or the frontend can enable
# its own Ingress here.
# ingress:
#   enabled: true
#   className: nginx
#   host: myapp.localtest.me
#   paths:
#     - path: /
#       pathType: Prefix
