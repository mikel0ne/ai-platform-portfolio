# =============================================================================
# values-java.yaml: template for Java / Spring Boot backends
# =============================================================================
# Usage:
#   helm upgrade --install my-backend infra/charts/generic-app \
#     -f infra/charts/generic-app/values-examples/values-java.yaml \
#     --set image.repository=my-backend \
#     --set image.tag=1.0.0
# =============================================================================

namespace: default   # your project's namespace

image:
  repository: my-backend   # image built locally or pushed to a registry
  tag: "1.0.0"
  pullPolicy: IfNotPresent

replicaCount: 1

strategy:
  # RollingUpdate: Kubernetes starts the new pod, waits for readiness, then stops the old one.
  # Switch to Recreate ONLY when the app keeps conversation state in memory (e.g. a LangGraph MemorySaver).
  type: RollingUpdate

container:
  port: 8080
  portName: http

service:
  type: ClusterIP
  port: 8080

# Non-sensitive environment variables (go into a ConfigMap)
configmap:
  enabled: true
  data:
    SPRING_PROFILES_ACTIVE: "prod"
    SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres.infra.svc.cluster.local:5432/mydb"
    JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"

# Sensitive variables: the chart references the Secrets but never creates them.
# Create them first with infra/scripts/create-secrets.ps1 or kubectl.
secretEnv:
  - name: DB_PASSWORD
    secretName: my-backend-secrets
    secretKey: DB_PASSWORD
  - name: API_KEY
    secretName: my-backend-secrets
    secretKey: API_KEY

probes:
  readiness:
    enabled: true
    httpGet:
      path: /actuator/health/readiness
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 6
  liveness:
    enabled: true
    httpGet:
      path: /actuator/health/liveness
      port: http
    initialDelaySeconds: 60
    periodSeconds: 15
    failureThreshold: 3

resources:
  requests:
    memory: 512Mi
    cpu: 250m
  limits:
    memory: 1Gi
    cpu: 1000m

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true

# Ingress: uncomment and adjust when external access is needed
# ingress:
#   enabled: true
#   className: nginx
#   host: myapp.localtest.me
#   paths:
#     - path: /api
#       pathType: Prefix
#     - path: /actuator/health
#       pathType: Prefix

# HPA: uncomment once the app is stateless and can scale
# hpa:
#   enabled: true
#   minReplicas: 1
#   maxReplicas: 4
#   targetCPUUtilizationPercentage: 70
