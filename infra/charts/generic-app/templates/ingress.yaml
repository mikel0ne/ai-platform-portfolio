{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "generic-app.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "generic-app.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- /* Paths of this service */}}
          {{- if .Values.ingress.paths }}
          {{- range .Values.ingress.paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "generic-app.fullname" $ }}
                port:
                  name: {{ $.Values.container.portName }}
          {{- end }}
          {{- else }}
          {{- /* Default "/" path when no paths are given */}}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "generic-app.fullname" . }}
                port:
                  name: {{ .Values.container.portName }}
          {{- end }}
          {{- /* Extra paths to other services (e.g. a frontend on the same Ingress) */}}
          {{- range .Values.ingressExtraPaths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ .serviceName }}
                port:
                  name: {{ .servicePort | default "http" }}
          {{- end }}
{{- end }}
