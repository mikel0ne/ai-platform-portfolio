# =============================================================================
# values-l1-copilot-frontend.yaml: L1 Support Copilot Angular frontend
# Chart: infra/charts/generic-app
# =============================================================================
# Deploy:
#   ./infra/scripts/deploy.sh --project l1-copilot --component frontend
#
# The Ingress is managed by infra/scripts/setup-app-ingress.sh --project l1-copilot
# with kubectl (not by the chart), so it stays disabled here to avoid clashing with
# that resource.
# =============================================================================

image:
  repository: registry.local/l1-copilot-frontend
  tag: "1.0.0"
  pullPolicy: IfNotPresent

replicaCount: 1

strategy:
  type: RollingUpdate

container:
  port: 8080   # nginx-unprivileged
  portName: http

service:
  type: ClusterIP
  port: 80

# Config is baked into the Angular build: no ConfigMap or Secrets
configmap:
  enabled: false
secretEnv: []

probes:
  readiness:
    enabled: true
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 3
    periodSeconds: 5
    failureThreshold: 3
  liveness:
    enabled: true
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 10
    periodSeconds: 15
    failureThreshold: 3

resources:
  requests:
    memory: 16Mi
    cpu: 10m
  limits:
    memory: 64Mi
    cpu: 100m

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

# The Ingress is managed by infra/scripts/setup-app-ingress.sh --project l1-copilot
ingress:
  enabled: false
