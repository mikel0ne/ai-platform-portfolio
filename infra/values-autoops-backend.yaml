# =============================================================================
# values-autoops-backend.yaml: AutoOps MCP server backend
# Chart: infra/charts/generic-app
# =============================================================================
# Deploy (orchestrated by infra/scripts/deploy.sh --project autoops):
#   ./infra/scripts/deploy.sh --project autoops --component backend --tag 0.1.0
#
# The backend serves at the same time:
#   - the MCP server over Streamable HTTP (/mcp)  <- Claude Code / Copilot
#   - the chat REST API                   (/search) <- Angular frontend
#   - Actuator                            (/actuator) <- probes
# RAG on the Weaviate SHARED in the `infra` namespace: one instance, AutoOps
# uses its own class (AutoopsDocChunk).
# =============================================================================

namespace: autoops

image:
  repository: registry.local/autoops-backend
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicaCount: 1

strategy:
  # State lives in Weaviate and the pod is stateless: RollingUpdate with
  # maxUnavailable=0 avoids downtime, and MCP (Streamable HTTP) clients reconnect.
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

container:
  port: 8080          # server.port in application.yml (no context path)
  portName: http

service:
  type: ClusterIP
  port: 8080

# Non-sensitive variables (k8s profile + shared Weaviate in the infra namespace).
# Spring relaxed binding: AUTOOPS_WEAVIATE_HOST -> autoops.weaviate.host, etc.
configmap:
  enabled: true
  data:
    SPRING_PROFILES_ACTIVE: "k8s"
    AUTOOPS_LLM_PROVIDER: "gemini"
    # Embedding model: gemini-embedding-2 (flexible 128-3000 dims). Free tier: 100 RPM.
    AUTOOPS_LLM_EMBEDDING_MODEL_NAME: "gemini-embedding-2"
    AUTOOPS_WEAVIATE_HOST: "weaviate.infra.svc.cluster.local"
    AUTOOPS_WEAVIATE_PORT: "8080"
    AUTOOPS_WEAVIATE_CLASS_NAME: "AutoopsDocChunk"
    # GitHub is the only ingestion source (local corpus disabled).
    # AUTOOPS_INGESTION_CORPUS_PATH: "/app/corpus"
    # Wiki.js: extra RAG source (WikiJsSource). Internal URL of the `wikijs` release
    # Service (namespace `wiki`, see infra/values-wikijs.yaml) and public URL for citations.
    AUTOOPS_WIKIJS_URL: "http://wikijs-generic-app.wiki.svc.cluster.local:3000"
    AUTOOPS_WIKIJS_PUBLIC_URL: "http://wiki.local"
    JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"

# Secrets synced by deploy.sh from infra/.env.local: Gemini key (chat + embeddings), GitHub
# token (reads the repo for RAG ingestion), Wiki.js key and the /admin token.
# The chart never creates them.
secretEnv:
  - name: GEMINI_API_KEY
    secretName: autoops-llm-secret
    secretKey: GEMINI_API_KEY
  - name: GITHUB_TOKEN
    secretName: autoops-llm-secret
    secretKey: GITHUB_TOKEN
  - name: WIKIJS_API_KEY
    secretName: wikijs-ingestion-secret
    secretKey: WIKIJS_API_KEY
  - name: AUTOOPS_ADMIN_TOKEN
    secretName: autoops-admin-secret
    secretKey: AUTOOPS_ADMIN_TOKEN

# READ-ONLY ServiceAccount for the Kubernetes tools, created by infra/rbac-autoops.yaml
# (applied by deploy.sh with its ClusterRole/ClusterRoleBinding). create:false because
# its lifecycle is cluster-scoped, outside the Helm release; the chart only references it.
serviceAccount:
  create: false
  name: autoops-mcp

# Actuator at the root (AutoOps has no context path).
probes:
  readiness:
    enabled: true
    httpGet:
      path: /actuator/health/readiness
      port: http
    initialDelaySeconds: 20
    periodSeconds: 10
    failureThreshold: 6
  liveness:
    enabled: true
    httpGet:
      path: /actuator/health/liveness
      port: http
    initialDelaySeconds: 40
    periodSeconds: 20
    failureThreshold: 3

resources:
  requests:
    memory: 512Mi
    cpu: 250m
  limits:
    memory: 1Gi
    # Generous CPU (2 cores): the generic chart always sets a limit, and this one is high
    # enough not to throttle the JVM on the local node.
    cpu: "2000m"

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true

# The Ingress is created by infra/scripts/setup-app-ingress.sh --project autoops
# (host autoops.local; /search /mcp /actuator -> backend, / -> frontend).
ingress:
  enabled: false

ingressExtraPaths: []
