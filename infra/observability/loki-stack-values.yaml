# =============================================================================
# loki-stack-values.yaml: values for the grafana/loki-stack chart
# =============================================================================
# SHARED log stack of the cluster (ns `observability`). It collects the logs of
# ALL namespaces (autoops, l1-copilot, infra...) through Promtail (DaemonSet).
# Lightweight, sized for a local Rancher Desktop.
#
# Installed by infra/scripts/07-setup-observability.sh:
#   helm upgrade --install loki grafana/loki-stack -n observability -f <this file>
#
# Components:
#   loki      - log store (single binary)
#   promtail  - DaemonSet tailing /var/log/pods on each node -> loki
#   grafana   - UI with the Loki datasource preconfigured
# =============================================================================

loki:
  enabled: true
  persistence:
    enabled: true
    size: 5Gi
  # Short retention: a local portfolio environment.
  config:
    table_manager:
      retention_deletes_enabled: true
      retention_period: 168h   # 7 days
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { memory: 512Mi }

promtail:
  enabled: true
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { memory: 256Mi }

  # Extra pipeline for the application namespaces, run AFTER the CRI stage (which
  # extracts the raw pod log). Only the autoops and l1-copilot pods emit JSON; the
  # match acts as a guard so the rest of the cluster keeps plain text.
  config:
    snippets:
      pipelineStages:
        # 1. Parse the container log format (CRI/Docker) -> field 'log'
        - cri: {}

        # 2. Our namespaces only: parse the JSON emitted by the backend pods
        #    (logstash-logback-encoder) and frontend pods (nginx json_access).
        - match:
            selector: '{namespace=~"autoops|l1-copilot"}'
            stages:
              # Extract the JSON fields into the pipeline data map
              - json:
                  expressions:
                    level:   level
                    service: service
                    message: message
              # Promote level and service to Loki labels so Grafana can filter
              # with: {namespace="autoops", level="ERROR"}
              - labels:
                  level:
                  service:
              # Use 'message' as the log line when present
              # (so Grafana does not list the whole raw JSON)
              - output:
                  source: message

grafana:
  enabled: true
  # adminPassword is passed by 07-setup-observability.sh from GRAFANA_ADMIN_PASSWORD (infra/.env.local).
  adminUser: admin
  # The Ingress comes from infra/observability/grafana-ingress.yaml (Traefik).
  ingress:
    enabled: false
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { memory: 256Mi }
  # loki-stack adds the Loki datasource pointing at the internal Service.

# Prometheus is out of scope here: logs only.
prometheus:
  enabled: false
