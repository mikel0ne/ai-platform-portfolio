# =============================================================================
# loki-stack-values.yaml — valores del chart grafana/loki-stack
# =============================================================================
# Stack de logs COMPARTIDO del clúster (ns `observability`). Recoge los logs de
# TODOS los namespaces (autoops, l1-copilot, infra…) vía Promtail (DaemonSet).
# Ligero, pensado para Rancher Desktop local.
#
# Lo instala infra/scripts/07-setup-observability.sh:
#   helm upgrade --install loki grafana/loki-stack -n observability -f <este fichero>
#
# Componentes:
#   loki      — almacén de logs (single-binary)
#   promtail  — DaemonSet que tailea /var/log/pods de cada nodo → loki
#   grafana   — UI + datasource Loki ya preconfigurado
# =============================================================================

loki:
  enabled: true
  persistence:
    enabled: true
    size: 5Gi
  # Retención corta: es un entorno local de portfolio.
  config:
    table_manager:
      retention_deletes_enabled: true
      retention_period: 168h   # 7 días
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { memory: 512Mi }

promtail:
  enabled: true
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { memory: 256Mi }

  # Pipeline adicional para los namespaces de las aplicaciones.
  # Se ejecuta DESPUÉS de la etapa CRI (que extrae el log crudo del pod).
  # Solo los pods de autoops y l1-copilot emiten JSON; el resto del clúster
  # sigue con texto plano sin que esta config les afecte (el match actúa de guarda).
  config:
    snippets:
      pipelineStages:
        # 1. Parsear el formato de log de contenedor (CRI/Docker) → campo 'log'
        - cri: {}

        # 2. Solo para nuestros namespaces: parsear el JSON que emiten los pods
        #    de backend (logstash-logback-encoder) y frontend (nginx json_access).
        - match:
            selector: '{namespace=~"autoops|l1-copilot"}'
            stages:
              # Extraer campos del JSON al mapa de datos del pipeline
              - json:
                  expressions:
                    level:   level
                    service: service
                    message: message
              # Promover level y service a etiquetas Loki para poder filtrar
              # en Grafana con: {namespace="autoops", level="ERROR"}
              - labels:
                  level:
                  service:
              # Usar el campo 'message' como contenido del log si existe
              # (evita que Grafana muestre el JSON crudo completo en el listado)
              - output:
                  source: message

grafana:
  enabled: true
  # adminPassword is passed by 07-setup-observability.sh from GRAFANA_ADMIN_PASSWORD (infra/.env.local).
  adminUser: admin
  # El Ingress lo monta infra/observability/grafana-ingress.yaml (Traefik).
  ingress:
    enabled: false
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { memory: 256Mi }
  # loki-stack añade automáticamente el datasource Loki apuntando al Service interno.

# Prometheus va aparte; aquí solo logs.
prometheus:
  enabled: false
