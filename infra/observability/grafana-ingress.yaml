# =============================================================================
# grafana-ingress.yaml: Grafana through Traefik at grafana.local
# =============================================================================
# The loki-stack chart names the Grafana Service <release>-grafana:
# with release "loki" it is "loki-grafana" (port 80).
#
# Resolve grafana.local with: infra/scripts/add-host.ps1 -Hostname grafana.local
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: observability
  labels:
    app.kubernetes.io/part-of: observability
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: "grafana.local"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: loki-grafana
                port:
                  number: 80
