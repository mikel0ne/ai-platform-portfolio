# L1 Support Copilot namespace. The generic-app chart does not create namespaces:
# deploy.sh applies this before the first helm install
# (or by hand:
#   kubectl apply -f infra/namespace-l1-copilot.yaml).
apiVersion: v1
kind: Namespace
metadata:
  name: l1-copilot
  labels:
    app.kubernetes.io/part-of: l1-copilot
