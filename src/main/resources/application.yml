spring:
  application:
    name: langchain4j-springboot
  profiles:
    active: dev

server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true

logging:
  level:
    root: INFO
    io.github.mikel0ne.l1copilot: DEBUG
    dev.langchain4j: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Configuración de LangChain4j (Google AI Studio)
# La API key se puede obtener gratis en https://aistudio.google.com/app/apikey
# Se recomienda pasarla por variable de entorno: GEMINI_API_KEY
langchain4j:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model-name: gemini-2.5-flash-lite
    timeout: 30s
    max-retries: 2

# Agente de soporte L1 (LangGraph4j)
copilot:
  max-recent-orders: 3

# Swagger UI / OpenAPI
springdoc:
  show-actuator: true
  paths-to-exclude: /actuator/health/**   # Oculta el endpoint /actuator/health/{*path} de Swagger (el wildcard duplicado)

# Actuator - Monitorización
management:
  endpoints:
    web:
      exposure:
        include: health,info,env
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: "@project.name@"
    description: "@project.description@"
    version: "@project.version@"

# Configuración de caché
cache:
  file:
    path: ./cache
  ttl-seconds: 3600  # 1 hora
