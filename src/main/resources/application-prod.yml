# Perfil de producción (Kubernetes)
# Todo lo variable entra por entorno: ver k8s/backend-configmap.yaml y los Secrets
# gemini-api-key / postgres-credentials (docs/infraestructura/07-secretos-y-configuracion.md)

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate    # el esquema lo gestiona la infraestructura (initdb de Postgres)
    open-in-view: false
  sql:
    init:
      mode: never

# Probes de Kubernetes: /actuator/health/liveness y /actuator/health/readiness
management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    io.github.mikel0ne.l1copilot: INFO
    dev.langchain4j: WARN
