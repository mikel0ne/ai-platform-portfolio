<section class="login">
  <h1>L1 Support Copilot</h1>
  <p class="subtitle">Selecciona un usuario de demostración para entrar.</p>

  @if (loading()) {
    <p class="hint">Cargando usuarios…</p>
  } @else if (error()) {
    <p class="error">{{ error() }}</p>
  } @else {
    <ul class="users">
      @for (u of users(); track u.id) {
        <li>
          <button class="user-card" (click)="enter(u)">
            @if (u.avatarUrl && !brokenAvatars.has(u.id)) {
              <img class="avatar" [src]="u.avatarUrl" [alt]="u.name" loading="lazy"
                   (error)="brokenAvatars.add(u.id)" />
            } @else {
              <span class="avatar avatar-fallback">{{ u.name.charAt(0) }}</span>
            }
            <span class="who">
              <span class="name">{{ u.name }} <span class="age">({{ u.age }} años)</span></span>
              <span class="id">{{ u.id }}</span>
            </span>
          </button>
        </li>
      }
    </ul>
  }
</section>
