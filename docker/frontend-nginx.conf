# Static SPA server shared by every frontend. Backend paths (/search and /mcp in AutoOps, /api in
# L1 Copilot) are routed by the Ingress, never by nginx.

# JSON access log for Loki: nginx:alpine links access.log to stdout, where Promtail picks it up.
log_format json_access escape=json
    '{'
        '"@timestamp":"$time_iso8601",'
        '"service":"frontend",'
        '"level":"info",'
        '"type":"access",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"http_user_agent":"$http_user_agent",'
        '"request_time":$request_time'
    '}';

server {
    listen 8080;
    server_name _;

    access_log /var/log/nginx/access.log json_access;
    error_log  /var/log/nginx/error.log  warn;

    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    index index.html;

    # index.html references the hashed bundles, so it must never be cached.
    location = /index.html {
        expires -1;
    }

    location ~* \.(js|css|woff2?|png|svg|ico)$ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
