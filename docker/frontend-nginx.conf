# nginx para la SPA Angular. Genérico para cualquier proyecto del monorepo (autoops,
# l1-copilot…): solo sirve estáticos, el ruteo a paths del backend (p.ej. /search y
# /mcp en AutoOps; /api en L1 Copilot) lo hace el Ingress, no nginx.

# ── Formato JSON estructurado para Loki/Grafana ──────────────────────────────
# Definido en el contexto http (este fichero se incluye desde /etc/nginx/nginx.conf
# dentro del bloque http {}). El access_log lo usa en el server block más abajo.
# En el contenedor nginx:alpine, /var/log/nginx/access.log es un symlink a /dev/stdout,
# por lo que los logs llegan a stdout y Promtail los recoge sin configuración extra.
log_format json_access escape=json
    '{'
        '"@timestamp":"$time_iso8601",'
        '"service":"frontend",'
        '"level":"info",'
        '"type":"access",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"http_user_agent":"$http_user_agent",'
        '"request_time":$request_time'
    '}';

server {
    listen 80;
    server_name _;

    # Logs JSON → stdout (vía symlink nginx:alpine → /dev/stdout → Promtail → Loki)
    access_log /var/log/nginx/access.log json_access;
    error_log  /var/log/nginx/error.log  warn;

    root /usr/share/nginx/html;
    index index.html;

    # index.html nunca se cachea (es el que referencia los bundles con hash)
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Estáticos con hash en el nombre: cache larga
    location ~* \.(js|css|woff2?|png|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Las llamadas al backend (POST /search, /api/**…) las enruta el Ingress, no nginx.
    # SPA fallback: el resto de rutas devuelven index.html (la app es una sola vista).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
