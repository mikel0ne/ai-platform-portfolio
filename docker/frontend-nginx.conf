# nginx para la SPA Angular. Solo estáticos: el ruteo /search y /sse -> backend lo hace el Ingress.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # index.html nunca se cachea (es el que referencia los bundles con hash)
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Estáticos con hash en el nombre: cache larga
    location ~* \.(js|css|woff2?|png|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # El chat de búsqueda llama a POST /search (lo enruta el Ingress al backend, no nginx).
    # SPA fallback: el resto de rutas devuelven index.html (la app es una sola vista).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
