name: CI

# Build + tests del backend en cada push y PR.
# Los tests de seguridad (@Tag("security")) quedan fuera por defecto: se lanzan
# bajo demanda con -Psecurity, no en cada build (ver backend/pom.xml).
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend build & tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build & test
        working-directory: backend
        run: mvn -B test

      # Publica el informe de cobertura JaCoCo (target/site/jacoco) como artefacto
      # descargable del run. Se genera siempre, incluso si algún test falla.
      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore
