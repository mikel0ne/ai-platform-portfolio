name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [autoops, l1-copilot]
    defaults:
      run:
        working-directory: ${{ matrix.project }}/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [autoops, l1-copilot]
    defaults:
      run:
        working-directory: ${{ matrix.project }}/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx ng test --watch=false --browsers=ChromeHeadless

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: helm lint infra/charts/generic-app
      - run: |
          for values in infra/values-*.yaml; do
            helm template check infra/charts/generic-app -f "$values" --namespace check > /dev/null
          done
      - run: shellcheck --severity=error infra/scripts/*.sh scripts/*.sh l1-copilot/scripts/*.sh wiki/scripts/*.sh
