# Learning project frozen in mid-2026: Dependabot tracks the dependencies but opens no version-update
# PRs (limit 0). Upgrades are done by hand when the project is picked up again.
version: 2
updates:
  - package-ecosystem: maven
    directories: ["/autoops/backend", "/l1-copilot/backend"]
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directories: ["/autoops/frontend", "/l1-copilot/frontend"]
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
