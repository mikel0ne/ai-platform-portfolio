spring:
  application:
    name: l1-copilot-backend
  profiles:
    active: dev
  datasource:
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:appuser}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: never
      platform: postgresql
      encoding: UTF-8

server:
  port: 8079
  servlet:
    # The Ingress routes /api/* to this Service unchanged; controllers do not repeat the prefix.
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true

logging:
  level:
    root: INFO
    io.github.mikel0ne.l1copilot: DEBUG
    dev.langchain4j: DEBUG

# API key from the environment: GEMINI_API_KEY (free at https://aistudio.google.com/app/apikey).
langchain4j:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    # gemini-* uses the native Gemini client; gemma-* the OpenAI-compatible endpoint (larger free quota).
    model-name: gemini-3.1-flash-lite
    timeout: 30s
    max-retries: 2
    # One model per role: classification must be deterministic, small talk benefits from variety.
    temperatures:
      deterministic: 0.0   # router and verifier
      ticket: 0.2          # ticket drafting: clean up the text without inventing facts
      response: 0.35       # business answers
      chat: 0.7            # small talk
    # NONE | LOW | MEDIUM | HIGH; ignored for gemma-* models.
    thinking-levels:
      deterministic: LOW
      ticket: NONE
      response: LOW
      chat: NONE           # thinking makes small talk stiff

copilot:
  max-recent-orders: 3
  # How much of the conversation each LLM sees; the full history always lives in the graph state.
  history:
    classifier:
      enabled: true
      size: 6
    responder:
      enabled: true
      size: 6
  # Turn log: raw material for the router's golden evaluation set.
  turn-log:
    file:
      enabled: true
      path: ./logs/turns.jsonl
    db:
      enabled: true

# From this age up the assistant addresses the user formally (usted); below it, informally (tú).
app:
  treatment:
    formal-age-threshold: 60

springdoc:
  show-actuator: true
  paths-to-exclude: /actuator/health/**
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,env
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: "@project.name@"
    description: "@project.description@"
    version: "@project.version@"

# LLM response cache for development, to save Gemini free-tier quota. Never enable it in a profile.
cache:
  enabled: false
  file:
    enabled: true
    path: ./cache
  ttl-seconds: 3600
