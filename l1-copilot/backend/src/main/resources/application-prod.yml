# Kubernetes profile. The l1_copilot database lives in the shared PostgreSQL of the `infra` namespace
# (created by l1-copilot/scripts/setup-l1-copilot-db.sh); credentials arrive as env vars from Secrets.
server:
  port: 8080   # must match container.port in the Helm values

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres.infra.svc.cluster.local:5432/l1_copilot}

logging:
  level:
    io.github.mikel0ne.l1copilot: INFO
    dev.langchain4j: WARN

# The pod filesystem is ephemeral, so only the database sink is kept.
copilot:
  turn-log:
    file:
      enabled: false
