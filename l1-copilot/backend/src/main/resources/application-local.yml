# Local profile: the shared PostgreSQL of the k3s cluster, reached at postgres.local (see infra/INFRA.md).
# Existing data is left alone; SQL_INIT_MODE=always reloads the demo seed.
spring:
  datasource:
    url: jdbc:postgresql://postgres.local:15432/l1_copilot
    password: ${SPRING_DATASOURCE_PASSWORD}
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}

management:
  endpoints:
    web:
      exposure:
        include: health,info,env
  endpoint:
    env:
      show-values: always
