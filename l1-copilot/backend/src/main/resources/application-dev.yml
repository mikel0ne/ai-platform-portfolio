# Development profile: in-memory H2 seeded on startup. GEMINI_API_KEY comes from the environment.
spring:
  datasource:
    url: jdbc:h2:mem:copilot;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      platform: h2
  h2:
    console:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,env
  endpoint:
    env:
      show-values: always

copilot:
  turn-log:
    db:
      enabled: false
