spring:
  application:
    name: langchain4j-springboot
  profiles:
    active: dev
  datasource:
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:appuser}
    password: ${SPRING_DATASOURCE_PASSWORD}   # sin fallback inseguro
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: never
      platform: postgresql
      encoding: UTF-8

server:
  port: 8079
  servlet:
    # Todo el back vive bajo /api. Los @RequestMapping NO repiten el prefijo:
    # el Ingress (Traefik) enruta /api/* -> este Service tal cual y el context-path
    # lo absorbe. El frontend Angular se sirve en / desde el mismo host.
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true

logging:
  level:
    root: INFO
    io.github.mikel0ne.l1copilot: DEBUG
    dev.langchain4j: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Configuración de LangChain4j (Google AI Studio)
# La API key se puede obtener gratis en https://aistudio.google.com/app/apikey
# Se recomienda pasarla por variable de entorno: GEMINI_API_KEY
langchain4j:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    # gemma-*  → cliente OpenAI-compatible (generativelanguage.googleapis.com/v1beta/openai/)
    #             cuota gratuita ~1500 req/día — ideal para desarrollo
    # gemini-* → cliente nativo Gemini; cuota gratuita ~20-50 req/día según modelo
    #
    # Otros modelos disponibles (cambiar aquí para todos los perfiles):
    #   gemma-4-27b-it        ← Gemma 4 26B  (OpenAI-compat, cuota generosa)
    #   gemma-4-27b-it        ← Gemma 4 26B  (OpenAI-compat, cuota generosa)
    #   gemini-3.1-flash-lite ← Gemini 3.1 Flash Lite (nativo, cuota independiente K8s)
    model-name: gemini-3.1-flash-lite
    timeout: 30s
    max-retries: 2
    # Temperatura por rol del LLM (creatividad según la tarea). Ajustables sin recompilar.
    # - deterministic: router + verificador → 0.0 (clasifican/juzgan; misma entrada → misma salida)
    # - ticket: redacción de incidencias → baja (limpia el texto sin inventar datos)
    # - response: respuestas de negocio → media (tono natural, fiel a los datos)
    # - chat: charla informal (modo chatty) → alta (calidez y variedad)
    temperatures:
      deterministic: 0.0
      ticket: 0.2
      response: 0.35
      chat: 0.7
    # Nivel de razonamiento (thinking budget) por rol. Solo aplica a modelos gemini-*;
    # para gemma-* se ignora silenciosamente.
    # Valores: NONE | LOW | MEDIUM | HIGH
    # - deterministic: LOW  → router (7+ intenciones, anáforas) y verificador (SURE/DOUBT/REJECT)
    #                         se benefician de reasoning ligero; sin latencia excesiva
    # - ticket: NONE        → transformación de texto, no razonamiento
    # - response: LOW       → interpreta instrucciones complejas del toolResult
    # - chat: NONE          → espontaneidad; el thinking la vuelve formal/rígida
    thinking-levels:
      deterministic: LOW
      ticket: NONE
      response: LOW
      chat: NONE

# Agente de soporte L1 (LangGraph4j)
copilot:
  max-recent-orders: 3
  # Memoria conversacional inyectada en los prompts del LLM. El historial ya se
  # acumula en el estado; aquí se decide cuánto ve cada LLM, de forma independiente.
  # - enabled=false  → ese consumidor no recibe historial (prompt = "(sin historial previo)")
  # - size           → nº máximo de mensajes recientes (USER/AGENT) incluidos en la ventana
  history:
    classifier:        # el router: ayuda a resolver referencias e intención según el hilo
      enabled: true
      size: 6
    responder:         # el redactor: coherencia del hilo y referencias ("eso", "lo de antes")
      enabled: true
      size: 6
  # Registro de turnos (materia prima del golden-set de evaluación).
  turn-log:
    file:
      enabled: true
      path: ./logs/turns.jsonl
    db:
      enabled: true

# Tratamiento del asistente: a partir de esta edad se trata de usted (amable);
# por debajo, se tutea (simpático). Aplica a mensajes generados y hardcodeados.
app:
  treatment:
    formal-age-threshold: 60

# Swagger UI / OpenAPI
springdoc:
  show-actuator: true
  paths-to-exclude: /actuator/health/**   # Oculta el endpoint /actuator/health/{*path} de Swagger (el wildcard duplicado)
  swagger-ui:
    # Ordenación alfabética de tags y operaciones a cargo de Swagger UI (antes se
    # reordenaba a mano con un OpenApiCustomizer; el orden alfabético es suficiente).
    tags-sorter: alpha
    operations-sorter: alpha

# Actuator - Monitorización
management:
  endpoints:
    web:
      exposure:
        include: health,info,env
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: "@project.name@"
    description: "@project.description@"
    version: "@project.version@"

# Caché de respuestas LLM: desactivada. Ningún perfil la activa — si algún día
# hace falta, se pone a true aquí (nunca en un fichero de perfil).
cache:
  enabled: false
  file:
    enabled: true
    path: ./cache
  ttl-seconds: 3600
