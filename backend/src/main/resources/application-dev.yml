# Perfil de desarrollo
# La API key NUNCA va en este fichero: define la variable de entorno GEMINI_API_KEY
# (obtenla gratis en https://aistudio.google.com/app/apikey)

spring:
  datasource:
    url: jdbc:h2:mem:copilot;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none        # el esquema lo crean schema.sql/data.sql
    open-in-view: false
  sql:
    init:
      mode: always          # ejecuta schema.sql + data.sql (seed de demo)
      encoding: UTF-8
  h2:
    console:
      enabled: true         # http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:copilot)

# Actuator - Monitorización
management:
  endpoint:
    env:
      show-values: always       # Muestra valores reales en /actuator/env (no ******)

# Logging
logging:
  level:
    io.github.mikel0ne.l1copilot: DEBUG
    dev.langchain4j: DEBUG
