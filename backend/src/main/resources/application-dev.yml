# Perfil de desarrollo
# La API key NUNCA va en este fichero: define la variable de entorno GEMINI_API_KEY
# (obtenla gratis en https://aistudio.google.com/app/apikey)

spring:
  datasource:
    url: jdbc:h2:mem:copilot;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      platform: h2
  h2:
    console:
      enabled: true   # http://localhost:8079/h2-console (JDBC URL: jdbc:h2:mem:copilot)

management:
  endpoint:
    env:
      show-values: always   # solo en local

copilot:
  turn-log:
    db:
      enabled: false
