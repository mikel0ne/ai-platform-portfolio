# Kubernetes profile: Weaviate shared in the `infra` namespace (one class per project) and Loki shared in
# `observability`. The chart ConfigMap (infra/values-autoops-backend.yaml) can override any of these.
autoops:
  weaviate:
    host: weaviate.infra.svc.cluster.local
    port: 8080
    class-name: AutoopsDocChunk
  loki:
    host: loki.observability.svc.cluster.local
    port: 3100

logging:
  level:
    io.github.mikel0ne.autoops: INFO
    dev.langchain4j: WARN
    org.springframework.ai: DEBUG
