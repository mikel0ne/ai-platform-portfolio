spring:
  application:
    name: autoops-mcp
  # Servidor MCP (Spring AI). En local el cliente puede usar stdio; desplegado, Streamable HTTP (perfil k8s).
  ai:
    mcp:
      server:
        name: autoops-mcp
        version: 0.1.0
        type: SYNC
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp
          # Ping periódico sobre la conexión para que no la mate un proxy/cliente por
          # inactividad (p.ej. el body-timeout ~300s de Node/undici en Copilot/VS Code).
          keep-alive-interval: 20s

server:
  port: 8080
  # Sin context-path: el endpoint MCP (SSE) vive en /sse, el chat en /search y la UI en /.

logging:
  level:
    root: INFO
    io.github.mikel0ne.autoops: DEBUG
    dev.langchain4j: INFO
  # El formato del appender se define en logback-spring.xml:
  #   - perfil !k8s → texto plano (local/dev)
  #   - perfil k8s  → JSON estructurado para Loki/Grafana

# Proveedor LLM/embeddings abstraído (doc 06). API key por entorno: GEMINI_API_KEY.
# El LLM es de uso interno (calificar/reformular en CRAG + redactar el chat); el cliente MCP razona.
autoops:
  llm:
    provider: gemini
    chat-model-name: gemini-3.1-flash-lite       # CRAG avanzado: eval chunks, reformular, redactar
    embedding-model-name: gemini-embedding-001   # solo para transformar a vectores; 100 RPM/1000 RPD
    timeout: 30s
    temperature: 0.2
  # Weaviate: en local, vía port-forward (kubectl port-forward svc/weaviate 8088:8080).
  weaviate:
    scheme: http
    host: localhost
    port: 8088
    grpc-port: 50051
    class-name: DocChunk
  # Loki: en local, vía port-forward (kubectl port-forward svc/loki 3100:3100 -n observability).
  loki:
    scheme: http
    host: localhost
    port: 3100
  # Bucle correctivo del RAG (CRAG). El tope de iteraciones garantiza la terminación (doc 03 §3).
  # 'grade' evalúa con el LLM si los chunks responden a la pregunta (sin atajo por score: no es fiable).
  crag:
    k: 5                   # nº de recuperaciones en la primera vuelta
    max-iteraciones: 2     # reformulaciones antes de devolver lo mejor obtenido
    alpha: 0.5             # peso vector vs BM25 en la búsqueda híbrida (1=vector, 0=BM25)
    k-step: 3              # cuánto crece k en cada iteración correctiva (amplía las recuperaciones)
    k-max: 12              # tope de k por mucho que itere el bucle
    multi-query-n: 3       # variantes en el abanico inicial (incluida la original); <=1 lo desactiva.
                           # Solo en la primera vuelta, nunca en reintentos: coste acotado a N-1
                           # recuperaciones/embeddings de más por consulta de usuario, una sola vez.
  # Ingesta del corpus (fuentes → chunks con ventana de vecinos → embeddings → Weaviate).
  ingestion:
    max-chars: 2000        # tamaño objetivo del núcleo (~500 tokens); la ventana almacenada es mayor
    overlap-chars: 200     # solape al subdividir un párrafo más largo que max-chars
    # La ingesta desde Git no va por aquí: el repo (y opcionalmente rama/subdir/webBase) se pasa por
    # parámetro en POST /admin/ingest/git, para poder ir alimentando la wiki con varios repos a demanda.

# Swagger UI / OpenAPI (chat de búsqueda)
springdoc:
  show-actuator: true
  paths-to-exclude: /actuator/health/**
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha

# Actuator: health con probes para Kubernetes
management:
  endpoints:
    web:
      exposure:
        include: health,info,env,mappings
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: "@project.name@"
    description: "@project.description@"
    version: "@project.version@"

# Caché de respuestas LLM (reutilizada del scaffolding): desactivada por defecto.
# Útil en desarrollo para no quemar cuota de Gemini. Activar solo aquí, nunca en perfiles.
cache:
  enabled: false
  file:
    enabled: true
    path: ./cache
  ttl-seconds: 3600
