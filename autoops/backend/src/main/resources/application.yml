spring:
  application:
    name: autoops-mcp
  ai:
    mcp:
      server:
        name: autoops-mcp
        version: 0.1.0
        type: SYNC
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp
          # Keeps idle connections alive past client body timeouts (~300s in Node/undici based clients).
          keep-alive-interval: 20s

server:
  port: 8080

logging:
  level:
    root: INFO
    io.github.mikel0ne.autoops: DEBUG
    dev.langchain4j: INFO

# The LLM is internal (grade/rewrite in CRAG, compose the chat answer); MCP clients do their own reasoning.
# API key from the environment: GEMINI_API_KEY.
autoops:
  llm:
    provider: gemini
    chat-model-name: gemini-3.1-flash-lite
    embedding-model-name: gemini-embedding-2
    timeout: 30s
    temperature: 0.2
  # Local runs reach the cluster services through port-forwards (see autoops/docs/infraestructura).
  weaviate:
    scheme: http
    host: localhost
    port: 8088
    grpc-port: 50051
    class-name: DocChunk
  loki:
    scheme: http
    host: localhost
    port: 3100
  crag:
    k: 5
    max-iterations: 2
    alpha: 0.5             # hybrid search weight: 1 = vector only, 0 = BM25 only
    k-step: 3
    k-max: 12
    multi-query-n: 3       # query variants on the first pass only, so the extra cost is bounded; <= 1 disables it
  # /search runs several LLM calls per query and has no authentication.
  search:
    max-requests-per-minute: 30
  ingestion:
    max-chars: 2000
    overlap-chars: 200
  # Without a url (local runs) the Wiki.js source disables itself; Kubernetes sets AUTOOPS_WIKIJS_URL.
  wikijs:
    locale: es
  # /admin/* requires the X-Admin-Token header; without a token the endpoints stay closed.
  admin:
    token: ${AUTOOPS_ADMIN_TOKEN:}

springdoc:
  show-actuator: true
  paths-to-exclude: /actuator/health/**
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: "@project.name@"
    description: "@project.description@"
    version: "@project.version@"

# LLM response cache for development, to save Gemini free-tier quota. Never enable it in a profile.
cache:
  enabled: false
  file:
    enabled: true
    path: ./cache
  ttl-seconds: 3600
