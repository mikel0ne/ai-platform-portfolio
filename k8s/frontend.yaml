# Frontend Angular servido por nginx (estáticos puros; el ruteo /api lo hace el Ingress).
# Ver docs/infraestructura/05-frontend.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: l1-copilot
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Para runAsNonRoot estricto, construir sobre nginxinc/nginx-unprivileged
          # (puerto 8080) en docker/frontend.Dockerfile y ajustar targetPort.
          image: l1-copilot-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              memory: 16Mi
              cpu: 10m
            limits:
              memory: 64Mi
              cpu: 100m
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: l1-copilot
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
