# Esquema y seed del L1 Support Copilot.
# La imagen oficial de postgres ejecuta estos .sql (orden alfabético) SOLO en el
# primer arranque con el volumen vacío. Ver docs/infraestructura/03-postgresql.md.
# El esquema debe mantenerse en sincronía con docs/arquitectura/03-modelo-datos.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: l1-copilot
data:
  01-schema.sql: |
    CREATE TABLE IF NOT EXISTS users (
        id    VARCHAR(20)  PRIMARY KEY,
        name  VARCHAR(100) NOT NULL,
        email VARCHAR(150) NOT NULL
    );

    CREATE TABLE IF NOT EXISTS orders (
        id                 BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        user_id            VARCHAR(20)  NOT NULL REFERENCES users(id),
        description        VARCHAR(255) NOT NULL,
        status             VARCHAR(20)  NOT NULL,
        order_date         DATE         NOT NULL,
        estimated_delivery DATE,
        tracking_carrier   VARCHAR(50)
    );

    CREATE TABLE IF NOT EXISTS tickets (
        id          BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        user_id     VARCHAR(20)   NOT NULL REFERENCES users(id),
        order_id    BIGINT        REFERENCES orders(id),
        subject     VARCHAR(200)  NOT NULL,
        description VARCHAR(2000) NOT NULL,
        status      VARCHAR(20)   NOT NULL,
        created_at  TIMESTAMP     NOT NULL
    );

  02-data.sql: |
    INSERT INTO users (id, name, email) VALUES
      ('u-001', 'Ana García', 'ana@example.com'),
      ('u-002', 'Luis Pérez', 'luis@example.com')
    ON CONFLICT DO NOTHING;

    -- u-001: escenario de referencia (dos pedidos recientes, uno en reparto)
    INSERT INTO orders (id, user_id, description, status, order_date, estimated_delivery, tracking_carrier) VALUES
      (123, 'u-001', 'Portátil Lenovo ThinkPad X1', 'IN_DELIVERY', CURRENT_DATE - 4,  CURRENT_DATE + 1,  'SEUR'),
      (456, 'u-001', 'Ratón inalámbrico Logitech',  'PAID',        CURRENT_DATE - 1,  CURRENT_DATE + 3,  NULL),
      (789, 'u-001', 'Monitor 27" Dell',            'DELIVERED',   CURRENT_DATE - 30, CURRENT_DATE - 25, 'MRW')
    ON CONFLICT DO NOTHING;

    -- u-002: cancelación permitida (200) y rechazada (201)
    INSERT INTO orders (id, user_id, description, status, order_date, estimated_delivery, tracking_carrier) VALUES
      (200, 'u-002', 'Teclado mecánico Keychron', 'CREATED', CURRENT_DATE,     CURRENT_DATE + 5, NULL),
      (201, 'u-002', 'Auriculares Sony WH-1000',  'SHIPPED', CURRENT_DATE - 2, CURRENT_DATE + 2, 'Correos')
    ON CONFLICT DO NOTHING;

    -- Las secuencias de identidad deben superar los ids insertados a mano
    SELECT setval(pg_get_serial_sequence('orders', 'id'), 1000, false);
